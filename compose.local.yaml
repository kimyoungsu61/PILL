name: pill-local
services:
  db:
    image: mysql:9.7.2
    command:
      - --innodb-buffer-pool-size=128M
      - --performance_schema=0
      - --disable-log-bin
    environment:
      MYSQL_DATABASE: pill_local
      MYSQL_USER: pill_local
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MYSQL_ROOT_PASSWORD
      MYSQL_PASSWORD_FILE: /run/secrets/PILL_DB_PASSWORD
      TZ: UTC
    secrets:
      - MYSQL_ROOT_PASSWORD
      - PILL_DB_PASSWORD
    volumes:
      - pill_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/PILL_DB_PASSWORD)" mysql --host=127.0.0.1 --user=pill_local --database=pill_local --execute='SELECT 1' --silent >/dev/null
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pill-local-app:development
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
      PILL_DB_URL: "jdbc:mysql://db:3306/pill_local?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8"
      PILL_DB_USERNAME: pill_local
      PILL_WEB_PUSH_ENABLED: "false"
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Duser.timezone=Asia/Seoul"
    secrets:
      - PILL_DB_PASSWORD
      - GEMINI_API_KEY
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "'
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    restart: unless-stopped
volumes:
  pill_mysql:
secrets:
  MYSQL_ROOT_PASSWORD:
    file: ./.local/docker/MYSQL_ROOT_PASSWORD
  PILL_DB_PASSWORD:
    file: ./.local/docker/PILL_DB_PASSWORD
  GEMINI_API_KEY:
    file: ./.local/docker/GEMINI_API_KEY
